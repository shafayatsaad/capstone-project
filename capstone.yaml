run: "python -m uvicorn app.main:app --host 0.0.0.0 --port 8000"
seed: "python seed.py"
test: "python eval.py"
base_url: "http://localhost:8000"
endpoints:
  health: "/health"
  images: "/images"
  image_upload: "POST /images (multipart form data)"
  batch: "/jobs/vision"
  posts: "/posts"
  suggestions: "/posts/{post_id}/images"
  review: "/suggestions/{suggestion_id}/review"
  costs: "/costs"
  evaluation: "/eval/run"
  latest_evaluation: "/eval/latest"
