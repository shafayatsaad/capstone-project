run: docker compose up --build
seed: docker compose exec app python seed.py
test: pytest -q
base_url: http://localhost:8000
endpoints:
  - method: GET
    path: /health
  - method: POST
    path: /auth/register
  - method: POST
    path: /auth/login
  - method: POST
    path: /widgets
    auth: bearer
  - method: GET
    path: /widgets/{widget_id}/embed
    auth: bearer
  - method: GET
    path: /widgets/{widget_id}/config
  - method: GET
    path: /widget.js
  - method: POST
    path: /submissions
  - method: GET
    path: /dashboard/submissions
    auth: bearer
  - method: GET
    path: /dashboard/stats
    auth: bearer
